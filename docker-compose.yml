services:

  # ==========================================================
  # Workspace para Visual Studio Code
  # ==========================================================
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: mysql-dev-workspace
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mysql_network
  # ==========================================================
  # MySQL
  # ==========================================================
  mysql_db:
    image: mysql:8.4
    container_name: mysql_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      # Persistencia de datos
      - mysql_data:/var/lib/mysql
      # Scripts de inicialización
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - mysql_network

  # ==========================================================
  # phpMyAdmin
  # ==========================================================

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT}:80"
    restart: unless-stopped
    networks:
      - mysql_network
# ============================================================
# Volúmenes
# ============================================================
volumes:
  mysql_data:
# ============================================================
# Redes
# ============================================================
networks:
  mysql_network:
    driver: bridge